name: backend-quality

on:
  workflow_dispatch:
  pull_request:
    paths: ["pom.xml", "ygh-*/**", "spec/**", ".github/workflows/backend-quality.yml"]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Generate CycloneDX SBOM
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease-sbom package -DskipTests
      - uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            target/bom.*
          if-no-files-found: warn
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose manifests
        env:
          MYSQL_ROOT_PASSWORD: ${PLACEHOLDER}
          POSTGRES_PASSWORD: ${PLACEHOLDER}
          ELASTIC_PASSWORD: ${PLACEHOLDER}
        run: docker compose -f ygh-deploy/enterprise-server/compose.yml config --quiet
