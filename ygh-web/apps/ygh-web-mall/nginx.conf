server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 50m;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /api/ { proxy_pass http://gateway:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 130s; proxy_buffering off; }
    location /.well-known/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
