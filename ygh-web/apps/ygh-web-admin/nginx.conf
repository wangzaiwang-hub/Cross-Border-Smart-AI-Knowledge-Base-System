server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location /api/ { proxy_pass http://gateway:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_buffering off; }
    location /.well-known/ { proxy_pass http://gateway:8080; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ { expires 7d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}
