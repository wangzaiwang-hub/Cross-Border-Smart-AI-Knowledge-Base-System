name: ygh-local

services:
  rocketmq-init:
    image: apache/rocketmq:5.3.1
    profiles: ["mall-deps"]
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command: ["chown -R 3000:3000 /home/rocketmq/store"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
    networks: [ygh-local]
    restart: "no"

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    profiles: ["mall-deps"]
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: -server -Xms128m -Xmx128m -Xmn64m
    ports:
      - "19876:9876"
    networks: [ygh-local]
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'The Name Server boot success' /home/rocketmq/logs/rocketmqlogs/namesrv.log"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    profiles: ["mall-deps"]
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_healthy
    command:
      - sh
      - mqbroker
      - -n
      - rocketmq-namesrv:9876
      - -c
      - /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: -server -Xms384m -Xmx384m -Xmn128m
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.1/conf/broker.conf:ro
      - rocketmq-store:/home/rocketmq/store
    networks: [ygh-local]
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'boot success' /home/rocketmq/logs/rocketmqlogs/broker.log"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  seata:
    image: apache/seata-server:2.5.0
    profiles: ["mall-deps"]
    environment:
      TZ: Asia/Shanghai
      STORE_MODE: file
      SEATA_IP: 192.168.154.1
      SEATA_PORT: 8091
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_MetaspaceSize: 96m
      JVM_MaxMetaspaceSize: 160m
      JVM_MaxDirectMemorySize: 128m
    ports:
      - "7091:7091"
      - "8091:8091"
    networks: [ygh-local]
    mem_limit: 512m
    cpus: 0.50
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8091'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.17
    profiles: ["ai-deps"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?required}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "19200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [ygh-local]
    mem_limit: 1280m
    cpus: 1.00
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  ygh-local:
    name: ygh-local

volumes:
  rocketmq-store:
    name: ygh-rocketmq-store
  elasticsearch-data:
    name: ygh-elasticsearch-data
