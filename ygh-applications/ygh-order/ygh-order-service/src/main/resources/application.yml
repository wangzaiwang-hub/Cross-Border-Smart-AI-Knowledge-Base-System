server.port: ${YGH_ORDER_PORT:8086}
spring:
  application.name: ygh-order-service
  datasource:
    url: ${YGH_ORDER_DB_URL}
    username: ${YGH_ORDER_DB_APP_USERNAME:ygh_order_app}
    password: ${YGH_ORDER_DB_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    url: ${YGH_ORDER_DB_URL}
    user: ${YGH_ORDER_DB_MIGRATION_USERNAME:ygh_order_migration}
    password: ${YGH_ORDER_DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
  cloud.nacos.discovery:
    server-addr: ${YGH_NACOS_SERVER_ADDR}
    username: ${YGH_NACOS_USERNAME}
    password: ${YGH_NACOS_PASSWORD}
    namespace: ${YGH_NACOS_NAMESPACE:ygh-dev}
    group: ${YGH_NACOS_DISCOVERY_GROUP:YGH_GROUP}
management.endpoints.web.exposure.include: health,info
ygh.internal-request.hmac-base64: ${YGH_INTERNAL_REQUEST_HMAC_BASE64}
